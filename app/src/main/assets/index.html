<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MarkNote Pro</title>
<style>
:root{--bg:#181920;--sf:#21232c;--sb:#1e2028;--pr:#60a5fa;--soft:rgba(96,165,250,.18);--tx:#e5e7eb;--mu:#8b92a5;--bd:#2e313d;--dg:#f87171;--ic:#d1d5db;--cr:#facc15;--red:#ff6b6b;--org:#ff9f43;--yel:#feca57;--cyn:#48dbfb;--grn:#1dd1a1;--pur:#c084fc}
body.light{--bg:#f8fafc;--sf:#fff;--sb:#f1f5f9;--pr:#1a73e8;--soft:#e8f0fe;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--dg:#dc2626;--ic:#334155;--cr:#1a73e8;--red:#dc2626;--org:#ea580c;--yel:#b45309;--cyn:#0284c7;--grn:#059669;--pur:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{position:fixed;top:0;left:0;right:0;height:46px;z-index:30;background:var(--bg);border-bottom:1px solid var(--bd);padding:4px 5px;display:flex;align-items:center;justify-content:space-between}
.tb{background:0 0;color:var(--ic);border:none;border-radius:7px;width:32px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:16px}
.tb:active,.tb.on{background:var(--soft);color:var(--pr)}
.tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wb{font-size:11px;font-weight:600;color:var(--mu);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:3px 7px;white-space:nowrap}
#fBar{position:fixed;top:46px;left:0;right:0;z-index:35;display:none;background:var(--sf);border-bottom:1px solid var(--bd);padding:6px 8px;gap:6px;align-items:center}
#fBar input{flex:1;min-width:65px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font-size:13px;outline:0}
.mb{background:var(--soft);color:var(--pr);border:none;border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer}
.ws{position:fixed;top:46px;bottom:52px;left:0;right:0;display:flex;overflow:hidden}
.ec{flex:1;min-width:0;display:flex;flex-direction:column;padding:6px 8px 4px 12px;overflow:hidden}
#tIn{width:100%;padding:4px 2px 7px;font-size:17px;font-weight:700;border:none;border-bottom:1px solid var(--bd);background:0 0;color:var(--yel);outline:0}
#tIn::placeholder{color:var(--mu);font-weight:600}
.hw{flex:1;position:relative;width:100%;overflow:hidden}
#hl,#ed{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:8px 2px;border:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;line-height:1.58;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;overflow-y:auto;overflow-x:hidden}
#hl{z-index:1;pointer-events:none;color:var(--tx);background:0 0}
#ed{z-index:2;background:0 0;color:var(--tx);caret-color:var(--cr);resize:none;outline:0}
#ed.hlon{color:transparent;-webkit-text-fill-color:transparent}
#ed::placeholder{color:var(--mu);-webkit-text-fill-color:var(--mu);font-family:sans-serif}
.cr{color:var(--red)}.co{color:var(--org)}.cy{color:var(--yel)}.cc{color:var(--cyn)}.cg{color:var(--grn)}.cp{color:var(--pur)}.cs{text-decoration:line-through}
#pv{flex:1;width:100%;padding:8px 2px;overflow-y:auto;line-height:1.62;display:none;color:var(--tx)}
#pv h1{color:var(--red);margin:.4em 0 .2em}#pv h2,#pv h3{color:var(--org);margin:.4em 0 .2em}#pv strong{color:var(--yel)}
#pv code,#pv pre{background:var(--sf);color:var(--grn);padding:2px 5px;border-radius:5px;font-family:monospace;border:1px solid var(--bd)}
#pv pre{padding:10px;white-space:pre-wrap}#pv blockquote{border-left:3px solid var(--org);margin:6px 0;padding-left:10px;color:var(--mu)}
#pv table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}#pv th,#pv td{border:1px solid var(--bd);padding:5px 7px;text-align:left}#pv th{background:var(--sf);color:var(--yel)}
#pv hr{border:none;border-top:1px solid var(--bd);margin:10px 0}#pv a{color:var(--cyn)}
.rp{width:44px;background:var(--sb);border-left:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:3px 0 10px;overflow-y:auto;scrollbar-width:none}
.rp::-webkit-scrollbar{display:none}.rp.hide{width:0;border:none;overflow:hidden;padding:0}
.ri{flex-shrink:0;width:36px;height:31px;margin:1px 0;background:0 0;border:none;border-radius:7px;color:var(--ic);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:Georgia,serif;font-size:16px;font-weight:700;padding:0}
.ri:active{background:var(--soft);color:var(--pr)}.ri svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bb{position:fixed;bottom:0;left:0;right:0;height:52px;z-index:40;background:var(--sf);border-top:1px solid var(--bd);padding:7px 6px 9px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bbt{background:0 0;border:1px solid var(--bd);border-radius:8px;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer}
.bbt:active{background:var(--soft);color:var(--pr)}.bbt.acc{background:var(--pr);border-color:var(--pr);color:#fff}
#nv{position:fixed;top:46px;bottom:0;left:0;right:0;display:none;overflow-y:auto;padding:12px;background:var(--bg);z-index:25}
.nc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ni{flex:1;overflow:hidden;cursor:pointer}.ni h4{margin:0 0 3px;font-size:15px;color:var(--yel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni p{margin:0;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db{background:rgba(248,113,113,.16);color:var(--dg);border:none;border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600}
.md{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:14px;z-index:60}
.mc{background:var(--sf);color:var(--tx);border:1px solid var(--bd);width:100%;max-width:370px;max-height:86vh;overflow-y:auto;border-radius:14px;padding:15px}
.mc h3{margin:0 0 10px;font-size:16px}
.er{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:7px;font-size:13.5px}
.ts{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);background:#111827;color:#f9fafb;border:1px solid #374151;padding:7px 14px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;white-space:nowrap}
.ts.show{opacity:1}
</style>
</head>
<body>
<header>
  <button type="button" class="tb" onclick="tNotes()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
  <button type="button" class="tb" onclick="undo()"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
  <button type="button" class="tb" onclick="redo()"><svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg></button>
  <span class="wb" id="wb">0 words</span>
  <button type="button" class="tb" id="fb" onclick="tFind()"><svg viewBox="0 0 24 24"><text x="4" y="15" font-size="13" font-family="sans-serif" font-weight="600" fill="currentColor" stroke="none">ab</text><path d="M3 19h18"/></svg></button>
  <button type="button" class="tb" onclick="oTpl()"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button>
  <button type="button" class="tb" onclick="tTheme()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2"/></svg></button>
  <button type="button" class="tb" id="pb" onclick="tPrev()"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button type="button" class="tb" onclick="tPanel()"><svg id="pa" viewBox="0 0 24 24"><polygon points="9 6 17 12 9 18 9 6" fill="currentColor" stroke="none"/></svg></button>
</header>

<div id="fBar">
  <input id="fIn" placeholder="Find...">
  <input id="rIn" placeholder="Replace...">
  <button type="button" class="mb" onclick="repAll()">Replace</button>
  <button type="button" class="mb" onclick="tFind()">✕</button>
</div>

<div class="ws">
  <div class="ec">
    <input id="tIn" placeholder="Title">
    <div class="hw" id="hw">
      <div id="hl"></div>
      <textarea id="ed" spellcheck="false" placeholder="Start typing MarkDown here or open .md / .docx / .html..."></textarea>
    </div>
    <div id="pv"></div>
  </div>
  <aside class="rp" id="rp">
    <button type="button" class="ri" style="color:var(--yel);font-weight:900" onmousedown="event.preventDefault()" onclick="tl('b')">B</button>
    <button type="button" class="ri" style="color:var(--yel);font-style:italic" onmousedown="event.preventDefault()" onclick="tl('i')">I</button>
    <button type="button" class="ri" style="color:var(--red);text-decoration:line-through" onmousedown="event.preventDefault()" onclick="tl('s')">S</button>
    <button type="button" class="ri" style="color:var(--red);font-family:sans-serif;font-size:13px" onmousedown="event.preventDefault()" onclick="tl('h1')">H1</button>
    <button type="button" class="ri" style="color:var(--org);font-family:sans-serif;font-size:13px" onmousedown="event.preventDefault()" onclick="tl('h2')">H2</button>
    <button type="button" class="ri" style="color:var(--org);font-family:sans-serif;font-size:13px" onmousedown="event.preventDefault()" onclick="tl('h3')">H3</button>
    <button type="button" class="ri" onmousedown="event.preventDefault()" onclick="tl('lnk')"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
    <button type="button" class="ri" onmousedown="event.preventDefault()" onclick="tl('img')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
    <button type="button" class="ri" style="color:var(--grn)" onmousedown="event.preventDefault()" onclick="tl('cd')"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
    <button type="button" class="ri" style="color:var(--cyn)" onmousedown="event.preventDefault()" onclick="tl('ls')"><svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
    <button type="button" class="ri" onmousedown="event.preventDefault()" onclick="tl('tb')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg></button>
    <button type="button" class="ri" onmousedown="event.preventDefault()" onclick="tl('qt')">❝</button>
    <button type="button" class="ri" onmousedown="event.preventDefault()" onclick="tl('hr')">—</button>
    <button type="button" class="ri" onmousedown="event.preventDefault()" onclick="tl('ck')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="8 12 11 15 16 9"/></svg></button>
    <button type="button" class="ri" style="color:var(--pur);font-style:italic;font-size:15px" onmousedown="event.preventDefault()" onclick="tl('fx')">fx</button>
  </aside>
</div>

<div id="nv">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <strong>सेव किए गए नोट्स (<span id="nc">0</span>)</strong>
    <button type="button" class="mb" onclick="nNote()">+ नया नोट</button>
  </div>
  <div id="nl"></div>
</div>

<div class="bb">
  <button type="button" class="bbt" onclick="pasteTxt()">Paste</button>
  <button type="button" class="bbt" onclick="copyTxt()">Copy</button>
  <button type="button" class="bbt" onclick="g('fi').click()">Open</button>
  <button type="button" class="bbt" onclick="saveN(false)">Save</button>
  <button type="button" class="bbt acc" onclick="g('em').style.display='flex'">Share</button>
</div>

<input type="file" id="fi" accept=".md,.markdown,.txt,.docx,.html,.htm,text/*,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none" onchange="pickF(event)">

<div class="md" id="em" onclick="if(event.target===this)this.style.display='none'">
  <div class="mc">
    <h3>Export / Share फ़ाइल</h3>
    <div class="er"><span><strong>Plain Text</strong> (Text / .txt)</span><div style="display:flex;gap:6px"><button type="button" class="mb" onclick="exp('txt','share')">Share</button><button type="button" class="mb" onclick="exp('txt','save')">Save</button></div></div>
    <div class="er"><span><strong>HTML Page</strong> (.html)</span><div style="display:flex;gap:6px"><button type="button" class="mb" onclick="exp('html','share')">Share</button><button type="button" class="mb" onclick="exp('html','save')">Save</button></div></div>
    <div class="er"><span><strong>Markdown</strong> (.md)</span><div style="display:flex;gap:6px"><button type="button" class="mb" onclick="exp('md','share')">Share</button><button type="button" class="mb" onclick="exp('md','save')">Save</button></div></div>
    <div class="er"><span><strong>Word</strong> (.docx)</span><div style="display:flex;gap:6px"><button type="button" class="mb" onclick="exp('docx','share')">Share</button><button type="button" class="mb" onclick="exp('docx','save')">Save</button></div></div>
    <div class="er"><span><strong>PDF</strong> (.pdf)</span><div style="display:flex;gap:6px"><button type="button" class="mb" onclick="exp('pdf','share')">Share</button><button type="button" class="mb" onclick="exp('pdf','save')">Save</button></div></div>
    <button type="button" class="bbt" style="width:100%;height:35px;margin-top:6px" onclick="g('em').style.display='none'">बंद करें</button>
  </div>
</div>

<div class="md" id="tm" onclick="if(event.target===this)this.style.display='none'">
  <div class="mc">
    <h3>Templates और शब्द गणना</h3>
    <p id="st" style="font-size:13px;color:var(--mu);margin-top:0"></p>
    <div class="er" style="cursor:pointer" onclick="lTpl('m')"><span>📋 <strong>Meeting Notes</strong> Template</span></div>
    <div class="er" style="cursor:pointer" onclick="lTpl('t')"><span>✅ <strong>Daily Checklist</strong> Template</span></div>
    <div class="er" style="cursor:pointer" onclick="lTpl('a')"><span>📝 <strong>Article / Table</strong> Template</span></div>
    <button type="button" class="bbt" style="width:100%;height:35px;margin-top:6px" onclick="g('tm').style.display='none'">बंद करें</button>
  </div>
</div>

<div class="ts" id="ts"></div>

<script>
var SK='mn_v3',notes=[];
try{notes=JSON.parse(localStorage.getItem(SK)||'[]')}catch(e){}
var cid=null,isP=false,isN=false,isC=false,uS=[''],rS=[],lS='';
function g(i){return document.getElementById(i)}
function msg(m){var t=g('ts');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function cInl(s){
  return s.replace(/(\*\*[^*]+\*\*|\*[^*]+\*|~~[^~]+~~|`[^`]+`|\$[^$]+\$|!?\[[^\]]+\]\([^)]+\))/g,function(k){
    if(k[0]==='*')return'<span class="cy">'+k+'</span>';
    if(k[0]==='~')return'<span class="cr cs">'+k+'</span>';
    if(k[0]==='`')return'<span class="cg">'+k+'</span>';
    if(k[0]==='$')return'<span class="cp">'+k+'</span>';
    return'<span class="co">'+k+'</span>';
  });
}
function cHtml(txt){
  var ic=false,out=txt.split('\n').map(function(r){
    var e=esc(r);
    if(r.trim().indexOf('```')===0){ic=!ic;return'<span class="cg">'+e+'</span>'}
    if(ic)return'<span class="cg">'+e+'</span>';
    if(/^#\s/.test(r))return'<span class="cr">'+e+'</span>';
    if(/^#{2,6}\s/.test(r)||/^>\s/.test(r))return'<span class="co">'+e+'</span>';
    if(/^\s*(---|\*\*\*)\s*$/.test(r))return'<span class="cc">'+e+'</span>';
    var m=e.match(/^(\s*(?:- [[ xX]]|-|\*|\d+\.)\s+)(.*)$/);
    return m?'<span class="cc">'+m[1]+'</span>'+cInl(m[2]):cInl(e);
  }).join('\n');
  return txt.slice(-1)==='\n'?out+' ':out;
}
function sync(push){
  var a=g('ed'),l=g('hl'),v=a.value;
  l.innerHTML=cHtml(v);a.classList.add('hlon');l.scrollTop=a.scrollTop;
  var w=v.trim()?v.trim().split(/\s+/).length:0;
  g('wb').textContent=w+' words';
  if(push&&v!==lS){uS.push(v);if(uS.length>50)uS.shift();rS=[];lS=v}
}
g('ed').addEventListener('input',function(){sync(true)});
g('ed').addEventListener('scroll',function(){g('hl').scrollTop=this.scrollTop});

function undo(){if(uS.length<=1)return msg('Undo के लिए कुछ नहीं है');rS.push(uS.pop());var p=uS[uS.length-1];g('ed').value=p;lS=p;sync(false)}
function redo(){if(!rS.length)return msg('Redo के लिए कुछ नहीं है');var n=rS.pop();uS.push(n);g('ed').value=n;lS=n;sync(false)}

function ins(s,e,rep,ss,se){
  var a=g('ed');if(isP)tPrev();a.focus();a.setSelectionRange(s,e);
  if(!document.execCommand('insertText',false,rep))a.value=a.value.slice(0,s)+rep+a.value.slice(e);
  if(typeof ss==='number')a.setSelectionRange(s+ss,s+se);
  sync(true);
}
function wrap(p,s,ph){var a=g('ed'),st=a.selectionStart||0,en=a.selectionEnd||0,sel=a.value.substring(st,en)||ph;ins(st,en,p+sel+s,p.length,p.length+sel.length)}
function pfx(p){
  var a=g('ed'),v=a.value,st=a.selectionStart||0,en=a.selectionEnd||0;
  var ls=v.lastIndexOf('\n',st-1)+1,le=v.indexOf('\n',en);if(le===-1)le=v.length;
  var up=v.substring(ls,le).split('\n').map(function(l){return l.indexOf(p)===0?l.slice(p.length):p+l.replace(/^(#{1,3}\s+|- [[ x]]\s+|- |\* |> )/,'')}).join('\n');
  ins(ls,le,up,up.length,up.length);
}
function tl(t){
  var a=g('ed'),st=a.selectionStart||0,en=a.selectionEnd||0,sel=a.value.substring(st,en);
  if(t==='b')wrap('**','**','bold');
  else if(t==='i')wrap('*','*','italic');
  else if(t==='s')wrap('~~','~~','strike');
  else if(t==='h1')pfx('# ');
  else if(t==='h2')pfx('## ');
  else if(t==='h3')pfx('### ');
  else if(t==='ls')pfx('- ');
  else if(t==='qt')pfx('> ');
  else if(t==='ck')pfx('- [ ] ');
  else if(t==='hr')ins(st,en,'\n---\n',5,5);
  else if(t==='fx')wrap('$','$','E=mc^2');
  else if(t==='tb'){var tb='\n| Col 1 | Col 2 | Col 3 |\n| :--- | :--- | :--- |\n| A1 | B1 | C1 |\n';ins(st,en,tb,tb.length,tb.length)}
  else if(t==='lnk'){var lt=sel||'Link';ins(st,en,'['+lt+'](https://)',lt.length+3,lt.length+11)}
  else if(t==='img'){var it=sel||'Image';ins(st,en,'!['+it+'](https://)',it.length+4,it.length+12)}
  else if(t==='cd'){if(sel.indexOf('\n')!==-1||!sel){var c=sel||'code';ins(st,en,'\n```\n'+c+'\n```\n',5,5+c.length)}else wrap('`','`','code')}
}

function addInl(p,txt){
  var rx=/(\*\*[^*]+\*\*|\*[^*]+\*|~~[^~]+~~|`[^`]+`|\$[^$]+\$|\[[^\]]+\]\([^)]+\))/g,li=0,m;
  while((m=rx.exec(txt))!==null){
    if(m.index>li)p.appendChild(document.createTextNode(txt.slice(li,m.index)));
    var tk=m[0],tg=null;
